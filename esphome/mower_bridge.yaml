# Mower Bridge — ESPHome configuration
#
# This firmware turns an ESP32 into a transparent TCP↔UART bridge between the
# Python client (WifiSerialMower) and the mower's serial interface.
#
# Prerequisites:
#   1. Install ESPHome: pip install esphome
#   2. Create secrets.yaml alongside this file (see bottom of file for keys).
#   3. Flash: esphome run mower_bridge.yaml
#
# The bridge is reachable at mower-bridge.local:8080 once connected to WiFi.

esphome:
  name: mower-bridge
  friendly_name: Mower Bridge

esp32:
  board: esp32dev          # change to match your board (e.g. esp32s3box)
  framework:
    type: arduino           # arduino is the most compatible choice for lwip sockets

# ── WiFi ─────────────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot for initial setup or if the network is unreachable.
  ap:
    ssid: "Mower Bridge Setup"
    password: !secret ap_password

captive_portal:

# ── Connectivity ──────────────────────────────────────────────────────────────
# mDNS is enabled by default; the bridge is accessible as mower-bridge.local
mdns:
  disabled: false

# ESPHome native API (optional — for the ESPHome dashboard/Home Assistant).
api:
  encryption:
    key: !secret api_key

# Over-the-air updates — flash new firmware without USB after first flash.
ota:
  - platform: esphome
    password: !secret ota_password

# Minimal web UI for status and logs.
web_server:
  port: 80

# ── Logging ───────────────────────────────────────────────────────────────────
logger:
  level: INFO

# ── UART to mower ─────────────────────────────────────────────────────────────
# Adjust tx_pin / rx_pin to match your wiring.
# Avoid GPIO1/GPIO3 (UART0 — used by USB-Serial for flashing/logs).
uart:
  id: uart_mower
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
  rx_buffer_size: 512

# ── Mower bridge component ────────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: components     # path relative to this YAML file
    components: [mower_bridge]

mower_bridge:
  uart_id: uart_mower
  port: 8080               # must match WifiSerialMower(host, port=8080)

# ── secrets.yaml (create alongside this file, never commit) ──────────────────
# wifi_ssid: "YourNetwork"
# wifi_password: "YourPassword"
# ap_password: "SetupPassword"
# api_password: "SomePassword"
# ota_password: "SomePassword"
